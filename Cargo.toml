[workspace]
resolver = "3"
members = ["crates/proto", "crates/agent", "crates/client"]
exclude = ["crates/proto/fuzz"]

[workspace.package]
# Releases take their version from the tag (.github/releases-repo/release.yml); this is only for local builds.
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
repository = "https://github.com/pocketgpu/pocketgpu-agent"

[workspace.dependencies]
# Pinned exactly: their APIs change between releases (research.md).
iroh = "=1.4.1"
nvml-wrapper = "=0.13.0"
sysinfo = "=0.39.6"

pocketgpu-proto = { path = "crates/proto" }
pocketgpu-client = { path = "crates/client" }

tokio = { version = "1", features = ["full"] }
postcard = { version = "1", features = ["use-std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"
blake3 = "1.8"

# Smaller, faster-linking debug builds: file:line backtraces for our code, no debug info
# for dependencies.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
strip = true

# Pairing stretches the code with Argon2id; unoptimized it would slow every test that pairs.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
