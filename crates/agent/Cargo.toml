[package]
name = "pocketgpu"
description = "PocketGPU agent and pgpu command line"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "pocketgpu"
path = "src/main.rs"

[lib]
name = "pocketgpu"
path = "src/lib.rs"

[dependencies]
pocketgpu-proto.workspace = true
pocketgpu-client.workspace = true
iroh = { workspace = true, features = ["unstable-net-report"] }
nvml-wrapper.workspace = true
sysinfo.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true
anyhow.workspace = true
directories = "6"
getrandom = "0.3"
qrcode = { version = "0.14", default-features = false }
rusqlite = { version = "0.37", features = ["bundled"] }
rusqlite_migration = "2"
toml = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
minisign-verify = "0.2"
sha2 = "0.10"
flate2 = "1"
tar = { version = "0.4", default-features = false }
portable-pty = "0.9"
# The Docker API over its local socket (F28); already in the tree through reqwest.
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
# IOKit and IOReport GPU stats on Apple silicon (F26).
core-foundation-sys = "0.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Environment",
    "Win32_System_Pipes",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }

[dev-dependencies]
minisign = { version = "0.7", default-features = false }
tempfile = "3"
insta = { version = "1", features = ["json"] }

