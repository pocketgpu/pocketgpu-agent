[package]
name = "pocketgpu-share-wasm"
description = "The share.pocketgpu.app guest page's way to the computer: iroh in the browser (F48)"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
publish = false

# Not in the workspace: iroh needs its default features off here, and the workspace would
# turn them back on (specs/F48-share-a-model/plan.md).
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
iroh = { version = "=1.5.0", default-features = false, features = ["tls-ring"] }
pocketgpu-proto = { path = "../../crates/proto" }
serde = { version = "1", features = ["derive"] }

[target.'cfg(target_family = "wasm")'.dependencies]
console_error_panic_hook = "0.1"
getrandom = { version = "0.3", features = ["wasm_js"] }
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
wasm-bindgen = "=0.2.122"
wasm-bindgen-futures = "0.4"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = "symbols"
